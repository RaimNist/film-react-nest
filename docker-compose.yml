version: '3.9'

services:
  backend:
    image: ghcr.io/raimnist/film-react-nest-backend:latest
    build:
      context: ./backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - db

  nginx:
    image: ghcr.io/raimnist/film-react-nest-nginx:latest
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  db:
    image: postgres:15
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    ports:
      - "8080:80"
    env_file:
      - ./backend/.env
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  postgres_data:
  pgadmin_data: